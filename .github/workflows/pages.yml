# Build the static viewer (site/) from mevzuat-tarihce and publish it on GitHub Pages.
#
# Run by hand (Actions > Deploy viewer > Run workflow). Before the first run: Settings >
# Pages > Source: "GitHub Actions". See docs/site.md.
name: Deploy viewer

on:
  workflow_dispatch:
    inputs:
      tarihce_ref:
        description: "mevzuat-tarihce branch, tag or commit"
        default: main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: sberkan09/mevzuat-tarihce
          ref: ${{ inputs.tarihce_ref }}
          path: tarihce
          fetch-depth: 0  # the viewer is built from the whole history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint and test (Python)
        run: |
          ruff check src tests
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test the viewer
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:unit
          npm run test:e2e
        env:
          CI: "1"

      - name: Build the data
        run: mevzuat-git site --repo tarihce --out site/data --repo-url https://github.com/sberkan09/mevzuat-tarihce

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
