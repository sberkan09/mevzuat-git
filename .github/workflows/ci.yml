name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" "ruff==0.16.8"
      - run: ruff check src tests
      # test_full_gvk_when_cached needs the data/raw cache (not in git) and skips here.
      - run: pytest -q
